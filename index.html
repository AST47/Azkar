<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أذكار وأدعية</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Reem+Kufi:wght@400;500;700&family=Tajawal:wght@300;400;500;700&display=swap');

:root{
  --bg:#F2E8D5;
  --bg-card:#FBF5E8;
  --ink:#2B2118;
  --ink-soft:#6B5A45;
  --teal:#1F5C4E;
  --teal-dark:#123B31;
  --gold:#AD8A3E;
  --gold-soft:#DCC08A;
  --gold-line: rgba(173,138,62,0.35);
  --danger:#8C3B2E;
}

*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg);
  background-image:
    radial-gradient(circle at 1px 1px, rgba(173,138,62,0.07) 1px, transparent 0);
  background-size: 18px 18px;
  color:var(--ink);
  font-family:'Tajawal', sans-serif;
  min-height:100vh;
  padding:28px 20px 80px;
}

.app{max-width:1120px; margin:0 auto;}

.app-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  flex-wrap:wrap;
  margin-bottom:14px;
}

.brand{display:flex; align-items:center; gap:12px;}
.brand svg{flex-shrink:0;}
.brand h1{
  font-family:'Reem Kufi', sans-serif;
  font-weight:700;
  font-size:30px;
  margin:0;
  color:var(--teal-dark);
  letter-spacing:0.5px;
}

.admin-toggle button{
  font-family:'Tajawal', sans-serif;
  font-size:13px;
  background:var(--bg-card);
  border:1px solid var(--gold-line);
  color:var(--ink-soft);
  padding:8px 14px;
  border-radius:8px;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:6px;
  transition:background .15s;
}
.admin-toggle button:hover{background:#F5EDD9;}
.admin-toggle button.active{
  background:var(--teal);
  color:#F5EDD9;
  border-color:var(--teal);
}

.ornament{
  height:14px;
  margin:6px 0 22px;
  background-image: repeating-linear-gradient(
    45deg, var(--gold-soft) 0 3px, transparent 3px 9px
  );
  opacity:0.55;
  mask-image: linear-gradient(90deg, transparent, black 15%, black 85%, transparent);
  -webkit-mask-image: linear-gradient(90deg, transparent, black 15%, black 85%, transparent);
}

.tabs{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:26px;
}
.tab{
  font-family:'Tajawal', sans-serif;
  font-size:14px;
  font-weight:500;
  background:transparent;
  border:1px solid var(--gold-line);
  color:var(--ink-soft);
  padding:9px 16px;
  border-radius:20px;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:7px;
  white-space:nowrap;
  transition:all .15s;
}
.tab:hover{background:rgba(173,138,62,0.1);}
.tab.active{
  background:var(--teal);
  border-color:var(--teal);
  color:#F5EDD9;
}
.tab.active.all-tab{
  background:var(--gold);
  border-color:var(--gold);
  color:#2B2118;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(230px, 1fr));
  gap:16px;
}

.card{
  background:var(--bg-card);
  border:1px solid var(--gold-line);
  border-radius:10px;
  padding:20px 18px 16px;
  position:relative;
  box-shadow:0 1px 0 rgba(43,33,24,0.04), 0 2px 6px rgba(43,33,24,0.05);
  display:flex;
  flex-direction:column;
  min-height:150px;
}

.card-text{
  font-family:'Amiri', serif;
  font-size:19px;
  line-height:1.9;
  color:var(--ink);
  flex:1;
  margin:0 0 14px;
}

.card-footer{
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-top:1px solid var(--gold-line);
  padding-top:10px;
  margin-top:auto;
}

.count-badge{
  display:inline-flex;
  align-items:center;
  gap:5px;
  font-family:'Tajawal', sans-serif;
  font-size:13px;
  font-weight:500;
  color:var(--gold);
  background:rgba(173,138,62,0.12);
  border:1px solid var(--gold-line);
  padding:3px 10px;
  border-radius:20px;
}

.card-actions{display:flex; gap:6px;}
.icon-btn{
  background:none;
  border:none;
  cursor:pointer;
  color:var(--ink-soft);
  font-size:15px;
  padding:4px 6px;
  border-radius:6px;
  line-height:1;
}
.icon-btn:hover{background:rgba(43,33,24,0.06);}
.icon-btn.danger:hover{color:var(--danger); background:rgba(140,59,46,0.08);}

.order-tag{
  position:absolute;
  top:10px;
  left:10px;
  font-size:11px;
  font-family:'Tajawal', sans-serif;
  color:var(--gold);
  background:var(--bg);
  border:1px solid var(--gold-line);
  border-radius:6px;
  padding:2px 6px;
}

.add-card{
  border:1.5px dashed var(--gold-line);
  background:transparent;
  color:var(--ink-soft);
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:150px;
  cursor:pointer;
  font-family:'Tajawal', sans-serif;
  font-size:15px;
  border-radius:10px;
}
.add-card:hover{background:rgba(173,138,62,0.06);}

.empty{
  grid-column:1/-1;
  text-align:center;
  padding:50px 20px;
  color:var(--ink-soft);
  font-size:15px;
}

.modal-overlay{
  position:fixed; inset:0;
  background:rgba(43,33,24,0.45);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:50;
}
.modal-overlay.open{display:flex;}
.modal{
  background:var(--bg-card);
  border-radius:12px;
  padding:24px;
  width:100%;
  max-width:440px;
  border:1px solid var(--gold-line);
}
.modal h3{
  font-family:'Reem Kufi', sans-serif;
  margin:0 0 16px;
  color:var(--teal-dark);
  font-size:18px;
}
.modal label{
  display:block;
  font-size:13px;
  color:var(--ink-soft);
  margin:14px 0 6px;
}
.modal input, .modal select, .modal textarea{
  width:100%;
  font-family:'Tajawal', sans-serif;
  font-size:14px;
  padding:9px 12px;
  border-radius:8px;
  border:1px solid var(--gold-line);
  background:#fff;
  color:var(--ink);
}
.modal textarea{
  font-family:'Amiri', serif;
  font-size:17px;
  min-height:100px;
  resize:vertical;
}
.modal-actions{
  display:flex;
  gap:8px;
  margin-top:20px;
  justify-content:flex-end;
}
.btn{
  font-family:'Tajawal', sans-serif;
  font-size:14px;
  padding:9px 18px;
  border-radius:8px;
  border:1px solid var(--gold-line);
  background:transparent;
  color:var(--ink-soft);
  cursor:pointer;
}
.btn-primary{
  background:var(--teal);
  border-color:var(--teal);
  color:#F5EDD9;
}
.error-text{color:var(--danger); font-size:13px; margin-top:8px; display:none;}
.error-text.show{display:block;}

.app-footer{
  margin-top:50px;
  padding-top:18px;
  border-top:1px solid var(--gold-line);
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  font-size:12.5px;
  color:var(--ink-soft);
}
.footer-name{justify-self:start; font-family:'Tajawal', sans-serif;}
.footer-link{
  justify-self:end;
  font-family:'Tajawal', sans-serif;
  color:var(--ink-soft);
  text-decoration:none;
  border-bottom:1px solid var(--gold-line);
  padding-bottom:1px;
  direction:ltr;
}
.footer-link:hover{color:var(--teal-dark); border-color:var(--teal);}
.footer-trigger{
  justify-self:center;
  color:var(--gold-line);
  font-size:13px;
  cursor:default;
  user-select:none;
}
.footer-trigger.active{color:var(--teal);}

.cat-badge{
  font-size:12px;
  color:var(--teal-dark);
  background:rgba(31,92,78,0.08);
  border:1px solid rgba(31,92,78,0.2);
  padding:3px 10px;
  border-radius:20px;
  margin-inline-start:6px;
}
.title-badge{
  font-size:12px;
  font-weight:500;
  color:var(--ink);
  background:rgba(43,33,24,0.06);
  border:1px solid rgba(43,33,24,0.15);
  padding:3px 10px;
  border-radius:20px;
  margin-inline-end:6px;
}
</style>
</head>
<body>
<div class="app">
  <header class="app-header">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34">
        <circle cx="17" cy="17" r="15.5" fill="none" stroke="#AD8A3E" stroke-width="1.3"/>
        <circle cx="17" cy="6" r="2.4" fill="#1F5C4E"/>
        <circle cx="26.7" cy="12" r="1.9" fill="#AD8A3E"/>
        <circle cx="26.7" cy="22" r="1.9" fill="#AD8A3E"/>
        <circle cx="17" cy="28" r="1.9" fill="#AD8A3E"/>
        <circle cx="7.3" cy="22" r="1.9" fill="#AD8A3E"/>
        <circle cx="7.3" cy="12" r="1.9" fill="#AD8A3E"/>
      </svg>
      <h1>أذكار وأدعية</h1>
    </div>
  </header>

  <div class="ornament"></div>

  <nav class="tabs" id="tabs"></nav>

  <main class="grid" id="grid"></main>

  <footer class="app-footer">
    <span class="footer-name">Ahmad Saleh Tuffaha</span>
    <span class="footer-trigger" id="footerTrigger">❖</span>
    <a class="footer-link" href="https://github.com/AST47/ahmadsalehtuffaha" target="_blank" rel="noopener">Portfolio</a>
  </footer>
</div>

<div class="modal-overlay" id="passwordModal">
  <div class="modal">
    <h3>الدخول لوضع التعديل</h3>
    <label>كلمة المرور</label>
    <input type="password" id="passwordInput" placeholder="أدخل كلمة المرور">
    <div class="error-text" id="passwordError">كلمة المرور غير صحيحة</div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal('passwordModal')">إلغاء</button>
      <button class="btn btn-primary" onclick="checkPassword()">دخول</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="editModal">
  <div class="modal">
    <h3 id="editModalTitle">إضافة ذكر</h3>
    <label>العنوان (اختياري)</label>
    <input type="text" id="editTitle" placeholder="مثال: عند الخروج من المسجد">
    <label>التصنيف</label>
    <select id="editCategory"></select>
    <label>نص الذكر</label>
    <textarea id="editText" placeholder="اكتب نص الذكر هنا"></textarea>
    <label>عدد التكرار</label>
    <input type="number" id="editCount" min="1" value="1">
    <div class="error-text" id="editError">الرجاء إدخال نص الذكر</div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal('editModal')">إلغاء</button>
      <button class="btn btn-primary" onclick="saveEdit()">حفظ</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>

  {text:"لا إله إلا الله وحده لا شريك له، له الملك، وله الحمد، يُحيي ويُميت، وهو على كل شيء قدير", count:10, categoryId:'during_day', order:1},

  {text:"اللهم لا سهل إلا ما جعلته سهلًا، وأنت تجعل الحزن إذا شئت سهلًا", count:10, categoryId:'during_day', order:7},
  {text:"اللّهم احرمني لذّة معصيتك، وارزقني لذّة طاعتك", count:10, categoryId:'during_day', order:8},

const SEED_ITEMS = [
  ...DEFAULT_ITEMS,
  {text:"الحمد لله الذي أحيانا بعد إذ أماتنا وإليه النشور", count:1, categoryId:'waking', order:1},
  {text:"أصبحنا وأصبح الملك لله ربّ العالمين، اللّهم إني أسألك خير هذا اليوم وخير ما بعده، وأعوذ بك من شرّ هذا اليوم وشرّ ما بعده، اللّهم إني أعوذ بك من الكسل وسوء الكبر، اللّهم إني أعوذ بك من عذاب في النار وعذاب في القبر", count:1, categoryId:'waking', order:2},
  {text:"اللّهمّ بك أصبحنا، وبك أمسينا، وبك نحيا، وبك نموت، وإليك النشور", count:1, categoryId:'waking', order:3},
  {text:"اللّهمّ إني أصبحت أشهد، وأشهد حملة عرشك، وملائكتك وجميع خلقك، أنّك أنت الله، لا إله إلّا أنت، وأنّ محمّداً عبدك ورسولك", count:4, categoryId:'waking', order:4},

  {text:"اللّهمّ عافني في بدني، اللّهمّ عافني في سمعي، اللّهمّ عافني في بصري، لا إله إلّا أنت", count:3, categoryId:'morning', order:10},

  {text:"اللّهمّ اهدني فيمن هديت، وعافني فيمن عافيت، وتولّني فيمن توليت، وبارك لي فيما أعطيت، وقني شرّ ما قضيت، إنّك تقضي ولا يُقضى عليك، إنّه لا يذلّ من واليت، تباركت ربّنا وتعاليت", title:"دعاء القنوت", count:1, categoryId:'means', order:16},
  {text:"اللهم اختم لنا شهر رمضان برضوانك، واعتق رقابنا من النيران، وأدخلنا فيه من المقبولين عندك، وبدّل بالأفراح أحزاننا", title:"آخر رمضان", count:1, categoryId:'means', order:17},
  {text:"اللهم ارزقني فضل قيام ليلة القدر، وسهّل أموري فيها من العسر إلى اليسر، وأقلّ معاذيري وحطّ عني الذنب والوزر، يا رؤوفاً بعباده الصالحين، اللهم ما قسمت في هذه الليلة من علم ورزق وعافية فاجعل لنا أوفر الحظ والنصيب", title:"ليلة القدر", count:1, categoryId:'means', order:18},
  {text:"يا رب ارزق أمي وأبي فرحاً لا ينتهي، وسعادة تنسيهم هموم الدنيا ومشاكلها، وارزقهم صحة في القلب وصفاء في الذهن، اللهم اغفر لي ولوالديّ ولمن أحسن إليّ", title:"دعاء الوالدين", count:1, categoryId:'means', order:19},
  {text:"اللهم اجعلنا بتلاوة كتابك منتفعين، وعند ختمه من الفائزين", title:"ختم القرآن", count:1, categoryId:'means', order:20}
];

let items = [];
let activeCategory = 'during_day';
let isAdmin = false;
let editingId = null;

async function loadData(){
  itemsRef.onSnapshot(snap => {
    items = (snap.exists && snap.data().items) ? snap.data().items : [];
    render();
  }, err => {
    console.error('فشل الاتصال بقاعدة البيانات', err);
  });

  const snap = await itemsRef.get();
  let current = (snap.exists && snap.data().items) ? snap.data().items : [];
  let changed = false;

  SEED_ITEMS.forEach(seed => {
    const exists = current.some(i => i.text === seed.text && i.categoryId === seed.categoryId);
    if(!exists){
      current.push({...seed, id: 'item_' + Date.now() + '_' + Math.random().toString(36).slice(2,8)});
      changed = true;
    }
  });

  if(changed){
    items = current;
    await saveData();
  }
}

async function saveData(){
  try{
    await itemsRef.set({items: items});
  }catch(e){
    console.error('فشل الحفظ', e);
    alert('في مشكلة بالحفظ، تأكد من اتصال الإنترنت وحاول مرة تانية.');
  }
}

function toggleAdmin(){
  if(isAdmin){
    isAdmin = false;
    document.getElementById('footerTrigger').classList.remove('active');
    render();
  }else{
    document.getElementById('passwordInput').value = '';
    document.getElementById('passwordError').classList.remove('show');
    document.getElementById('passwordModal').classList.add('open');
  }
}

function checkPassword(){
  const val = document.getElementById('passwordInput').value;
  if(val === ADMIN_PASSWORD){
    isAdmin = true;
    document.getElementById('footerTrigger').classList.add('active');
    closeModal('passwordModal');
    render();
  }else{
    document.getElementById('passwordError').classList.add('show');
  }
}

function closeModal(id){
  document.getElementById(id).classList.remove('open');
}

function renderTabs(){
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  CATEGORIES.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'tab' + (cat.id === activeCategory ? ' active' : '') + (cat.id === 'all' ? ' all-tab' : '');
    btn.textContent = cat.label;
    btn.onclick = () => { activeCategory = cat.id; render(); };
    tabs.appendChild(btn);
  });
}

function getFilteredItems(){
  let list = activeCategory === 'all' ? [...items] : items.filter(i => i.categoryId === activeCategory);
  list.sort((a,b) => a.order - b.order);
  return list;
}

function render(){
  renderTabs();
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  const list = getFilteredItems();

  if(list.length === 0 && !isAdmin){
    grid.innerHTML = '<div class="empty">لا يوجد أذكار في هذا القسم بعد</div>';
    return;
  }

  list.forEach((item, idx) => {
    const card = document.createElement('div');
    card.className = 'card';

    if(isAdmin){
      const tag = document.createElement('div');
      tag.className = 'order-tag';
      tag.textContent = 'ترتيب ' + item.order;
      card.appendChild(tag);
    }

    const text = document.createElement('p');
    text.className = 'card-text';
    text.textContent = item.text;
    card.appendChild(text);

    const footer = document.createElement('div');
    footer.className = 'card-footer';

    const badgeGroup = document.createElement('div');
    badgeGroup.style.display = 'flex';
    badgeGroup.style.alignItems = 'center';

    if(item.title){
      const titleBadge = document.createElement('span');
      titleBadge.className = 'title-badge';
      titleBadge.textContent = item.title;
      badgeGroup.appendChild(titleBadge);
    }

    const badge = document.createElement('span');
    badge.className = 'count-badge';
    badge.textContent = '× ' + item.count;
    if(item.count > 1){
      badgeGroup.appendChild(badge);
    }

    if(activeCategory === 'all'){
      const catLabel = CATEGORIES.find(c => c.id === item.categoryId);
      if(catLabel){
        const catBadge = document.createElement('span');
        catBadge.className = 'cat-badge';
        catBadge.textContent = catLabel.label;
        badgeGroup.appendChild(catBadge);
      }
    }

    footer.appendChild(badgeGroup);

    const actions = document.createElement('div');
    actions.className = 'card-actions';

    if(isAdmin){
      const upBtn = document.createElement('button');
      upBtn.className = 'icon-btn';
      upBtn.title = 'تحريك لأعلى';
      upBtn.textContent = '↑';
      upBtn.onclick = () => moveItem(item.id, -1);
      actions.appendChild(upBtn);

      const downBtn = document.createElement('button');
      downBtn.className = 'icon-btn';
      downBtn.title = 'تحريك لأسفل';
      downBtn.textContent = '↓';
      downBtn.onclick = () => moveItem(item.id, 1);
      actions.appendChild(downBtn);

      const editBtn = document.createElement('button');
      editBtn.className = 'icon-btn';
      editBtn.title = 'تعديل';
      editBtn.textContent = '✎';
      editBtn.onclick = () => openEdit(item.id);
      actions.appendChild(editBtn);

      const delBtn = document.createElement('button');
      delBtn.className = 'icon-btn danger';
      delBtn.title = 'حذف';
      delBtn.textContent = '✕';
      delBtn.onclick = () => deleteItem(item.id);
      actions.appendChild(delBtn);
    }

    footer.appendChild(actions);
    card.appendChild(footer);
    grid.appendChild(card);
  });

  if(isAdmin){
    const addCard = document.createElement('div');
    addCard.className = 'add-card';
    addCard.textContent = '+ إضافة ذكر';
    addCard.onclick = () => openEdit(null);
    grid.appendChild(addCard);
  }
}

function moveItem(id, direction){
  const list = getFilteredItems();
  const idx = list.findIndex(i => i.id === id);
  const swapIdx = idx + direction;
  if(swapIdx < 0 || swapIdx >= list.length) return;
  const a = list[idx], b = list[swapIdx];
  const tmp = a.order;
  a.order = b.order;
  b.order = tmp;
  saveData();
  render();
}

function openEdit(id){
  editingId = id;
  const select = document.getElementById('editCategory');
  select.innerHTML = '';
  CATEGORIES.filter(c => c.id !== 'all').forEach(cat => {
    const opt = document.createElement('option');
    opt.value = cat.id;
    opt.textContent = cat.label;
    select.appendChild(opt);
  });

  document.getElementById('editError').classList.remove('show');

  if(id){
    const item = items.find(i => i.id === id);
    document.getElementById('editModalTitle').textContent = 'تعديل الذكر';
    document.getElementById('editTitle').value = item.title || '';
    select.value = item.categoryId;
    document.getElementById('editText').value = item.text;
    document.getElementById('editCount').value = item.count;
  }else{
    document.getElementById('editModalTitle').textContent = 'إضافة ذكر';
    document.getElementById('editTitle').value = '';
    select.value = activeCategory === 'all' ? CATEGORIES[1].id : activeCategory;
    document.getElementById('editText').value = '';
    document.getElementById('editCount').value = 1;
  }

  document.getElementById('editModal').classList.add('open');
}

function saveEdit(){
  const text = document.getElementById('editText').value.trim();
  const title = document.getElementById('editTitle').value.trim();
  const categoryId = document.getElementById('editCategory').value;
  const count = parseInt(document.getElementById('editCount').value) || 1;

  if(!text){
    document.getElementById('editError').classList.add('show');
    return;
  }

  if(editingId){
    const item = items.find(i => i.id === editingId);
    item.text = text;
    item.title = title;
    item.categoryId = categoryId;
    item.count = count;
  }else{
    const catItems = items.filter(i => i.categoryId === categoryId);
    const maxOrder = catItems.length ? Math.max(...catItems.map(i => i.order)) : 0;
    items.push({
      id: 'item_' + Date.now(),
      text, title, categoryId, count,
      order: maxOrder + 1
    });
  }

  saveData();
  closeModal('editModal');
  render();
}

function deleteItem(id){
  if(!confirm('هل تريد حذف هذا الذكر؟')) return;
  items = items.filter(i => i.id !== id);
  saveData();
  render();
}

document.getElementById('footerTrigger').onclick = toggleAdmin;

loadData();
</script>
</body>
</html>
