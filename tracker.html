<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المتابعة اليومية</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400;500;700&family=Tajawal:wght@300;400;500;700&display=swap');

:root{
  --bg:#F2E8D5;
  --bg-card:#FBF5E8;
  --ink:#2B2118;
  --ink-soft:#6B5A45;
  --teal:#1F5C4E;
  --teal-dark:#123B31;
  --gold:#AD8A3E;
  --gold-soft:#DCC08A;
  --gold-line: rgba(173,138,62,0.35);
}

*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg);
  background-image: radial-gradient(circle at 1px 1px, rgba(173,138,62,0.07) 1px, transparent 0);
  background-size:18px 18px;
  color:var(--ink);
  font-family:'Tajawal', sans-serif;
  min-height:100vh;
  padding:28px 20px 60px;
}

.app{max-width:640px; margin:0 auto;}

header{text-align:center; margin-bottom:6px;}
h1{
  font-family:'Reem Kufi', sans-serif;
  font-weight:700;
  font-size:26px;
  margin:0 0 4px;
  color:var(--teal-dark);
}
.today-date{
  font-size:14px;
  color:var(--ink-soft);
}

.top-actions{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-bottom:18px;
}
.top-actions a, .top-actions button{
  font-family:'Tajawal', sans-serif;
  font-size:13px;
  background:var(--bg-card);
  border:1px solid var(--gold-line);
  color:var(--ink-soft);
  padding:8px 16px;
  border-radius:20px;
  cursor:pointer;
  text-decoration:none;
  display:inline-flex;
  align-items:center;
  gap:6px;
}
.top-actions a:hover, .top-actions button:hover{background:rgba(173,138,62,0.1);}
.top-actions .reset-btn{color:#7A2E2E; border-color:rgba(122,46,46,0.3);}
.top-actions .reset-btn:hover{background:rgba(122,46,46,0.08);}

.progress{
  text-align:center;
  font-size:13px;
  color:var(--gold);
  margin:14px 0 22px;
}

section{margin-bottom:26px;}
.section-label{
  font-family:'Reem Kufi', sans-serif;
  font-size:15px;
  color:var(--teal-dark);
  margin:0 0 10px;
  text-align:center;
}

.grid5{
  display:grid;
  grid-template-columns:repeat(5, 1fr);
  gap:8px;
}
.grid3{
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:10px;
  max-width:340px;
  margin:0 auto;
}
.box{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
  background:var(--bg-card);
  border:1.5px solid var(--gold-line);
  border-radius:10px;
  padding:14px 4px 10px;
  cursor:pointer;
  transition:transform .1s, background .15s, border-color .15s;
  text-align:center;
}
.box:active{transform:scale(0.96);}
.box.done{background:var(--teal); border-color:var(--teal);}
.box.done .box-label{color:#F5EDD9;}
.check-circle{
  width:26px;
  height:26px;
  border-radius:50%;
  border:2px solid var(--gold-line);
  display:flex;
  align-items:center;
  justify-content:center;
  color:transparent;
  transition:all .15s;
}
.box.done .check-circle{
  background:#F5EDD9;
  border-color:#F5EDD9;
  color:var(--teal);
}
.box-label{
  font-size:12.5px;
  color:var(--ink-soft);
  text-align:center;
  line-height:1.3;
}

.reset-note{
  text-align:center;
  font-size:12px;
  color:var(--ink-soft);
  margin-top:20px;
  opacity:0.75;
}

@media (max-width:420px){
  .grid5{gap:6px;}
  .box{padding:10px 2px 8px;}
  .box-label{font-size:11px;}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>المتابعة اليومية</h1>
    <div class="today-date" id="todayDate"></div>
  </header>

  <div class="top-actions">
    <a href="https://ast47.github.io/Azkar/">→ رجوع للأذكار</a>
    <button class="reset-btn" id="resetBtn">إعادة تصفير اليوم</button>
  </div>

  <div class="progress" id="progressText"></div>

  <section>
    <div class="section-label">ورد اليوم من القرآن</div>
    <div class="grid5" id="quranGrid"></div>
  </section>

  <section>
    <div class="section-label">الصلوات</div>
    <div class="grid5" id="prayersGrid"></div>
  </section>

  <section>
    <div class="section-label">الأذكار</div>
    <div class="grid5" id="azkarCatGrid"></div>
  </section>

  <section>
    <div class="section-label">أذكار اليوم</div>
    <div class="grid3" id="azkarTimesGrid"></div>
  </section>

  <div class="reset-note">البوكسات بترجع فاضية تلقائياً كل يوم جديد</div>
</div>

<script>
const QURAN = [
  {id:'yaseen', label:'يس'},
  {id:'rahman', label:'الرحمن'},
  {id:'juz', label:'جزء اليوم'},
  {id:'waqiah', label:'الواقعة'},
  {id:'mulk', label:'الملك'}
];

const PRAYERS = [
  {id:'fajr', label:'الفجر'},
  {id:'dhuhr', label:'الظهر'},
  {id:'asr', label:'العصر'},
  {id:'maghrib', label:'المغرب'},
  {id:'isha', label:'العشاء'}
];

const AZKAR_CATEGORIES = [
  {id:'waking', label:'الاستيقاظ'},
  {id:'morning', label:'الصباح'},
  {id:'noon', label:'الظهيرة'},
  {id:'evening', label:'المساء'},
  {id:'sleep', label:'قبل النوم'}
];

const AZKAR_TIMES = [
  {id:'t1', label:'المجموعة الأولى'},
  {id:'t2', label:'المجموعة الثانية'},
  {id:'t3', label:'المجموعة الثالثة'}
];

function todayKey(){
  const d = new Date();
  return 'tracker-' + d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
}

function freshState(){
  const fresh = {quran:{}, prayers:{}, azkarCategories:{}, azkarTimes:{}};
  QURAN.forEach(q => fresh.quran[q.id] = false);
  PRAYERS.forEach(p => fresh.prayers[p.id] = false);
  AZKAR_CATEGORIES.forEach(a => fresh.azkarCategories[a.id] = false);
  AZKAR_TIMES.forEach(a => fresh.azkarTimes[a.id] = false);
  return fresh;
}

function isValidState(s){
  if(!s || typeof s !== 'object') return false;
  const hasAll = (obj, list) => obj && typeof obj === 'object' && list.every(i => i.id in obj);
  return hasAll(s.quran, QURAN) && hasAll(s.prayers, PRAYERS)
    && hasAll(s.azkarCategories, AZKAR_CATEGORIES) && hasAll(s.azkarTimes, AZKAR_TIMES);
}

function loadState(){
  const key = todayKey();
  Object.keys(localStorage)
    .filter(k => k.startsWith('tracker-') && k !== key)
    .forEach(k => localStorage.removeItem(k));

  const raw = localStorage.getItem(key);
  if(raw){
    try{
      const parsed = JSON.parse(raw);
      // لو البنية المخزنة قديمة (من نسخة سابقة) بنرجع لحالة فاضية
      // بدل ما نخلي الكبسات ما تشتغل بصمت
      if(isValidState(parsed)) return parsed;
    }catch(e){}
  }
  return freshState();
}

function saveState(){
  localStorage.setItem(todayKey(), JSON.stringify(state));
}

let state = loadState();

function renderDate(){
  const d = new Date();
  const formatted = new Intl.DateTimeFormat('ar', {weekday:'long', day:'numeric', month:'long', year:'numeric'}).format(d);
  document.getElementById('todayDate').textContent = formatted;
}

function renderProgress(){
  const total = QURAN.length + PRAYERS.length + AZKAR_CATEGORIES.length + AZKAR_TIMES.length;
  let done = QURAN.filter(q => state.quran[q.id]).length;
  done += PRAYERS.filter(p => state.prayers[p.id]).length;
  done += AZKAR_CATEGORIES.filter(a => state.azkarCategories[a.id]).length;
  done += AZKAR_TIMES.filter(a => state.azkarTimes[a.id]).length;
  document.getElementById('progressText').textContent = done + ' من ' + total + ' مكتملة اليوم';
}

function renderGrid(containerId, list, stateKey){
  const container = document.getElementById(containerId);
  container.innerHTML = '';
  list.forEach(item => {
    const box = document.createElement('div');
    box.className = 'box' + (state[stateKey][item.id] ? ' done' : '');
    box.innerHTML = `
      <span class="check-circle">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
      </span>
      <span class="box-label">${item.label}</span>
    `;
    box.onclick = () => {
      state[stateKey][item.id] = !state[stateKey][item.id];
      saveState();
      render();
    };
    container.appendChild(box);
  });
}

function render(){
  renderProgress();
  renderGrid('quranGrid', QURAN, 'quran');
  renderGrid('prayersGrid', PRAYERS, 'prayers');
  renderGrid('azkarCatGrid', AZKAR_CATEGORIES, 'azkarCategories');
  renderGrid('azkarTimesGrid', AZKAR_TIMES, 'azkarTimes');
}

renderDate();
render();

let resetArmed = false;
let resetTimer = null;
const resetBtn = document.getElementById('resetBtn');
const resetBtnOriginalText = resetBtn.textContent;

resetBtn.onclick = () => {
  if(!resetArmed){
    resetArmed = true;
    resetBtn.textContent = 'متأكد؟ دوس تاني للتأكيد';
    clearTimeout(resetTimer);
    resetTimer = setTimeout(() => {
      resetArmed = false;
      resetBtn.textContent = resetBtnOriginalText;
    }, 3000);
    return;
  }
  clearTimeout(resetTimer);
  resetArmed = false;
  resetBtn.textContent = resetBtnOriginalText;
  localStorage.removeItem(todayKey());
  state = freshState();
  render();
};
</script>
</body>
</html>
